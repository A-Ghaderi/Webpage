# publications.yml lists both publication types and publications

# Types of publication (in order of listing on page)
publication_types:
  - type_id: pre-pub
    pretty: Pre-publication
  - type_id: peer-reviewed-paper
    pretty: Peer-reviewed papers
  - type_id: peer-reviewed-abstract
    pretty: Peer-reviewed abstracts
    overview: |
      These are short (usually 2-page) summaries of research recently published or
      to be published elsewhere.
  - type_id: book-chapter
    pretty: Book chapters
  - type_id: misc
    pretty: Miscellaneous
    overview: |
      Miscellaneous publications that are not peer reviewed.
################################
# Listing of publications
################################
# Valid fields
# - citation
# - year
# - venue
# - type
# - badges
# - presentation_link
# - link
# - pdf
# - bibtex_id
# - bibtex


publications:

  - citation: |
      Aref Ghaderi, Vahid Morovati, and Roozbeh Dargazany (2020).
      A Physics-Informed Assembly of Feed-Forward Neural Network Engines to Predict Inelasticity in Cross-Linked Polymers.
      Polymers.
      <https://doi.org/10.3390/polym12112628>
    year: 2020
    type: peer-reviewed-paper
    venue: Journal
    bibtex_id: ghaderi2020physics
    bibtex: |
      ```
      @article{ghaderi2020physics,
      title={A physics-informed assembly of feed-forward neural network engines to predict inelasticity in cross-linked polymers},
      author={Ghaderi, Aref and Morovati, Vahid and Dargazany, Roozbeh},
      journal={Polymers},
      volume={12},
      number={11},
      pages={2628},
      year={2020},
      publisher={MDPI}
     }
      ```

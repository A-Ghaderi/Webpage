# publications.yml lists both publication types and publications

# Types of publication (in order of listing on page)
publication_types:
  - type_id: pre-pub
    pretty: Pre-publication
  - type_id: peer-reviewed-paper
    pretty: Peer-reviewed papers
  - type_id: peer-reviewed-abstract
    pretty: Peer-reviewed abstracts
    overview: |
      These are short (usually 2-page) summaries of research recently published or
      to be published elsewhere.
  - type_id: book-chapter
    pretty: Book chapters
  - type_id: misc
    pretty: Miscellaneous
    overview: |
      Miscellaneous publications that are not peer reviewed.
################################
# Listing of publications
################################
# Valid fields
# - citation
# - year
# - venue
# - type
# - badges
# - presentation_link
# - link
# - pdf
# - bibtex_id
# - bibtex

publications:

 - citation: |
      Aref Ghaderi, Ramin Akbari, Yang Chen, and Roozbeh Dargazany (2022).
      A Knowledge-driven Physics-Informed Neural Network model; Pyrolysis and Ablation of Polymers
      arXiv. [arXiv:2209.11749v1](https://doi.org/10.48550/arXiv.2209.11749)
     year: 2022
     type: pre-pub
     venue: preprint
     bibtex_id: moreno2021matchmaker
     bibtex: |
       ```
       @article{ghaderi2022knowledge,
        title={A Knowledge-driven Physics-Informed Neural Network model; Pyrolysis and Ablation of Polymers},
        author={Ghaderi, Aref and Akbari, Ramin and Chen, Yang and Dargazany, Roozbeh},
        journal={arXiv preprint arXiv:2209.11749},
        year={2022}
       }
        ```

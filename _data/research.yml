# research.yml gives research project entries used on the Research page

- project: GenAI Agent Platform
  description: |
    Designed and deployed a production-grade GenAI agent platform integrating retrieval, tool usage, and code execution.
    Built scalable pipelines leveraging BigQuery and LLM orchestration frameworks to enable complex multi-step reasoning workflows.
    Improved response quality, grounding, and system reliability for enterprise use cases.

  technologies: [LLMs, RAG, BigQuery, LangGraph, Python, Distributed Systems]

- project: Multimodal Safety Agent
  description: |
    Developed a multimodal AI agent for hazard detection from store ceiling images, combining visual understanding with reasoning and task automation.
    Implemented localization and decision-making pipelines that automatically assign tasks to store associates, enabling real-world operational impact.
    Focused on robustness, interpretability, and safety in production environments.

  technologies: [VLMs, Multimodal AI, Computer Vision, LangGraph, Python]

- project: LLM-Powered Search System (Ford)
  description: |
    Built and deployed an AI-powered semantic search system for call center agents using LLMs and retrieval pipelines.
    Reduced response time by 60% and significantly improved knowledge accessibility and agent efficiency.
    Designed end-to-end system including data ingestion, indexing, retrieval, and response generation.

  technologies: [LLMs, NLP, Information Retrieval, BigQuery, Python]

- project: Recommendation Engine for Call Center Optimization
  description: |
    Developed a recommendation system to assist call center agents with next-best actions, reducing average call duration by 20%.
    Leveraged historical interaction data and machine learning models to optimize decision-making in real time.
    Integrated into production workflows with measurable business impact.

  technologies: [Recommendation Systems, Machine Learning, Python, SQL]

- project: Global Contact Center Analytics Pipeline
  description: |
    Led the design and implementation of a large-scale data pipeline processing global call center interactions.
    Built NLP-based systems for sentiment analysis, issue classification, and trend detection to support operational insights.
    Enabled real-time monitoring and improved decision-making for leadership teams.

  technologies: [NLP, Apache Airflow, GCP Dataflow, BigQuery, Python]

- project: EV Charging Reliability & Cost Optimization Model
  description: |
    Developed a reliability scoring model for electric vehicle charging stations and optimized home charging costs using intelligent power system modeling.
    Combined statistical modeling and optimization techniques to improve system efficiency and user experience.

  technologies: [Statistical Modeling, Optimization, Python, Energy Systems]
